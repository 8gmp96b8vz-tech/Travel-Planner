<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">✈ Travel Planner</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search a city... e.g. Kyiv">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <main class="layout">

    <section class="panel" id="resultsPanel">
      <h2 class="panel-title">Results</h2>
      <div id="filterControls" style="display: none; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        
        <select id="categoryFilter" onchange="filterAndSortResults()" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); outline: none;">
          <option value="all">All Categories</option>
          <option value="tourism">Tourism & Sights</option>
          <option value="catering">Food & Restaurants</option>
          <option value="entertainment">Entertainment</option>
        </select>

        <select id="sortFilter" onchange="filterAndSortResults()" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); outline: none;">
          <option value="default">Default order</option>
          <option value="distance">Nearest first (Distance)</option>
        </select>
      </div>
      <div id="results">
        <p class="placeholder">Search for a city to see places.</p>
      </div>
    </section>

    <aside class="panel" id="tripPanel">
      <h2 class="panel-title">My Trip List</h2>
      
      <div class="sort-buttons">
        <button onclick="sortTrip('name')">Sort by Name</button>
        <button onclick="sortTrip('category')">Sort by Category</button>
      </div>

      <ul id="tripItems"></ul>
      <p class="empty-msg" id="emptyMsg">Your list is empty. Add some places!</p>
    </aside>

  </main>
  <div id="detailsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modalTitle">Place Name</h2>
      <span class="category" id="modalCategory">Category</span>
      <p id="modalAddress" style="margin: 10px 0; color: var(--muted);"></p>
      
      <div id="map" style="height: 300px; width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border);"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  
  <script src="app.js"></script>
</body>
</html>
