<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="#" style="text-decoration: none; display: flex; align-items: center; gap: 20px;">
    <svg width="220" height="50" viewBox="0 0 250 60" xmlns="http://www.w3.org/2000/svg">
    
    <g transform="translate(0, 2)">
      <path d="M 25 5 C 13.9 5 5 13.9 5 25 C 5 40 25 55 25 55 C 25 55 45 40 45 25 C 45 13.9 36.1 5 25 5 Z" fill="#F97316" />
      <circle cx="25" cy="22" r="10" fill="#FFFFFF" />
      <path d="M 18 26 L 22 18 L 25 22 L 28 15 L 32 26 Z" fill="#1b6cbd" />
    </g>

    <text x="55" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="1">TUM</text>
    
    <text x="57" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7" letter-spacing="2.5">TRAVEL PLANNER</text>
    </svg>
    </a>
  
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search a city... e.g. Kyiv">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <main class="layout">

    <section class="panel" id="resultsPanel">
      <h2 class="panel-title">Results</h2>
      <div id="filterControls" style="display: none; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        
        <select id="categoryFilter" onchange="filterAndSortResults()" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); outline: none;">
          <option value="all">All Categories</option>
          <option value="tourism">Tourism & Sights</option>
          <option value="catering">Food & Restaurants</option>
          <option value="entertainment">Entertainment</option>
        </select>

        <select id="sortFilter" onchange="filterAndSortResults()" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border); outline: none;">
          <option value="default">Default order</option>
          <option value="distance">Nearest first (Distance)</option>
        </select>
      </div>
      <div id="results">
        <p class="placeholder">Search for a city to see places.</p>
      </div>
    </section>

    <aside class="panel" id="tripPanel">
      <h2 class="panel-title">My Trip List</h2>
      <form id="customPlaceForm" style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;">
        <input type="text" id="customName" placeholder="Custom place name..." required style="flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none; min-width: 120px;">
        <select id="customCategory" style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none;">
          <option value="custom">Custom</option>
          <option value="hotel">Hotel</option>
          <option value="meeting">Meeting Point</option>
        </select>
        <button type="submit" style="padding: 8px 12px; background: var(--green); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">+ Add</button>
      </form>
      <div class="sort-buttons">
        <button onclick="sortTrip('name')">Sort by Name</button>
        <button onclick="sortTrip('category')">Sort by Category</button>
      </div>

      <ul id="tripItems"></ul>
      <p class="empty-msg" id="emptyMsg">Your list is empty. Add some places!</p>
    </aside>

  </main>
  <div id="detailsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <h2 id="modalTitle">Place Name</h2>
      <span class="category" id="modalCategory">Category</span>
      <p id="modalAddress" style="margin: 10px 0; color: var(--muted);"></p>
      <p id="modalDescription" style="margin: 10px 0; font-size: 14px; line-height: 1.4; color: var(--text);"></p>
      <a id="modalMapLink" href="#" target="_blank" style="display: inline-block; margin-bottom: 10px; color: var(--blue); font-weight: bold; text-decoration: none; font-size: 14px;"> Open in Google Maps</a>
      <img id="modalImage" src="https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=600&q=80" alt="Place" style="width: 100%; height: 150px; object-fit: cover; border-radius: 8px; display: none;">
      <div id="map" style="height: 300px; width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border);"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  
  <script src="app.js"></script>
</body>
</html><aside class="panel" id="tripPanel">
